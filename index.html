<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" /><style>
.dsh-makers-tip[data-tip]{position:relative;display:inline-flex;max-width:100%;vertical-align:middle;cursor:not-allowed}
.dsh-makers-tip[data-tip]>:disabled{pointer-events:none}
.dsh-makers-locked{opacity:.45;cursor:not-allowed}
#dsh-makers-hover-tip{position:fixed;z-index:2147483647;pointer-events:none;background:var(--dsw-alias-label-primary,#1a1a1a);color:var(--dsw-alias-bg-layer-3,#fff);white-space:nowrap;border-radius:6px;padding:4px 8px;font-size:11px;line-height:17px;font-weight:400;max-width:min(320px,calc(100vw - 16px));box-shadow:0 4px 12px rgba(0,0,0,.18)}
#dsh-makers-hover-tip[hidden]{display:none!important}
/* ---- 移动端适配（窄屏 ≤700px）----
   1) 修复输入框底部工具栏文字重叠：窄屏下 composer 的 tools 容器被 flex
      压成 0 宽，但 workspace 模式选择器文字 overflow:visible 溢出，正好叠在
      模型选择器上（"Workspace Write" 与 "DeepSeek-V4-Flash Default" 叠印）。
      处理：隐藏 workspace 模式选择器（默认 Write 仍生效），模型选择器独占。
   2) 侧边栏顶部化：折叠 rail 原本是占 56px 宽的左侧竖条，浪费窄屏横向空间。
      处理：把折叠态 rail 改为 52px 高的顶部横条（logo/新建/搜索在左，设置
      在右），内容区下移并占满整宽；展开态抽屉浮层覆盖内容、不再挤压变形。
      作用域严格限定 data-sidebar-collapsed，避免影响桌面端与设置页。 */
@media (max-width:700px){
  [class*="_row"]:has([class*="_tools"]) [class*="_modes"]{display:none!important}
  [class*="_row"]:has([class*="_tools"]){gap:8px!important}
  [class*="_row"]:has([class*="_tools"]) [class*="_trailing"]{min-width:0!important;flex:1 1 auto!important}
  [class*="_headline"]{font-size:20px!important;column-gap:6px!important}

  /* 2a. 折叠态：rail 变顶部横条，内容区下移占满宽度 */
  [class*="_frame"][data-sidebar-collapsed="true"]{
    grid-template-columns:minmax(0,1fr)!important;
    grid-template-rows:52px minmax(0,1fr)!important;
  }
  [class*="_frame"][data-sidebar-collapsed="true"] > [class*="_sidebarCol"]{
    grid-column:1!important;grid-row:1!important;
    width:100%!important;height:52px!important;
    border-bottom:1px solid rgba(0,0,0,.06);z-index:10;
  }
  [class*="_frame"][data-sidebar-collapsed="true"] > [class*="_centerCol"]{
    grid-column:1!important;grid-row:2!important;
    width:100%!important;min-height:0!important;
  }
  [class*="_frame"][data-sidebar-collapsed="true"] > [class*="_detailsCol"]{display:none!important}
  [class*="_frame"][data-sidebar-collapsed="true"] [class*="_root"][class*="_collapsed"]{
    flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;
    width:100%!important;height:52px!important;padding:0 12px!important;box-sizing:border-box!important;gap:6px!important;
  }
  [class*="_frame"][data-sidebar-collapsed="true"] [class*="_logoRow"],
  [class*="_frame"][data-sidebar-collapsed="true"] [class*="_newSession"]{flex:0 0 auto!important;height:40px!important}
  [class*="_frame"][data-sidebar-collapsed="true"] [class*="_regionArea"]{
    flex:0 0 auto!important;flex-direction:row!important;align-items:center!important;height:40px!important;width:auto!important;
  }
  [class*="_frame"][data-sidebar-collapsed="true"] [class*="_root"][class*="_rail"]{flex-direction:row!important;height:40px!important;width:auto!important}
  [class*="_frame"][data-sidebar-collapsed="true"] [class*="_listArea"]{display:none!important}
  [class*="_frame"][data-sidebar-collapsed="true"] [class*="_footArea"]{
    flex:0 0 auto!important;flex-direction:row!important;align-items:center!important;height:40px!important;margin-left:auto!important;
  }

  /* 2b. 展开态：WorkBuddy 式抽屉——从左侧滑出，带半透明遮罩，点遮罩收起。
         data-sidebar-collapsed 属性消失即为展开。宽度克制在 80vw/300px，
         圆角 + 阴影营造浮层感；遮罩由 JS 注入 #dsh-drawer-scrim。 */
  [class*="_frame"]:not([data-sidebar-collapsed]){grid-template-columns:minmax(0,1fr)!important}
  [class*="_frame"]:not([data-sidebar-collapsed]) > [class*="_sidebarCol"]{
    position:fixed!important;left:0!important;top:0!important;bottom:0!important;z-index:62!important;
    width:min(300px,80vw)!important;height:100dvh!important;
    border-radius:0 16px 16px 0!important;overflow:hidden!important;
    box-shadow:10px 0 40px rgba(0,0,0,.22)!important;
    animation:dshDrawerIn .2s ease-out!important;
  }
  @keyframes dshDrawerIn{from{transform:translateX(-12%);opacity:.6}to{transform:translateX(0);opacity:1}}
  #dsh-drawer-scrim{
    position:fixed!important;inset:0!important;z-index:61!important;
    background:rgba(15,18,26,.42)!important;opacity:0;visibility:hidden;
    transition:opacity .2s ease!important;
  }
  body[data-dsh-drawer="open"] #dsh-drawer-scrim{opacity:1!important;visibility:visible!important}
  [class*="_frame"]:not([data-sidebar-collapsed]) > [class*="_centerCol"]{grid-column:1!important;width:100%!important}

  /* 3. 右上角的 EdgeOne Makers 快捷入口（了解更多 / GitHub 源码 / 模版部署）
        原本是内容区顶部一条 50px 高的独立横条，手机上白占一行；
        改为并入顶部导航条：落在搜索按钮右侧、设置按钮左侧。
        这些节点有固定 id（#dsh-makers-chrome / -powered / -actions），
        不是哈希类名，官方前端升级也不会失效。 */
  #dsh-makers-chrome{
    position:fixed!important;top:0!important;left:0!important;right:0!important;
    width:auto!important;height:53px!important;margin:0!important;padding:0!important;
    align-items:center!important;justify-content:flex-end!important;gap:2px!important;
    z-index:11!important;pointer-events:none!important;background:transparent!important;
  }
  #dsh-makers-chrome > *{pointer-events:auto!important}
  /* 关键：官方前端在「进入会话」后会把 #dsh-makers-powered / #dsh-makers-actions
     从顶栏容器搬进会话头部 .wSkVaW_titleRow，和 Session log 并排。因此不能只
     定位父容器（会话态它是空的），必须把两个子元素自身 fixed 到顶栏；用
     right 定位，360/390 宽都能贴着设置齿轮左侧，不会被挤压或盖住齿轮。 */
  #dsh-makers-powered{
    position:fixed!important;top:11px!important;left:auto!important;right:147px!important;
    height:32px!important;padding:0!important;margin:0!important;
    flex:0 0 auto!important;width:auto!important;max-width:none!important;overflow:visible!important;
    z-index:11!important;
    /* 会话态官方加 data-docked="true" 配 translate(-50%,-50%)，会把 fixed 元素拽偏 */
    transform:none!important;
  }
  .dsh-makers-powered-label,.dsh-makers-powered-divider{display:none!important}
  .dsh-makers-powered-more{
    height:32px!important;padding:0 2px 0 6px!important;gap:1px!important;
    flex:0 0 auto!important;white-space:nowrap!important;
  }
  .dsh-makers-powered-more-label{font-size:12px!important;line-height:1!important;white-space:nowrap!important}
  #dsh-makers-actions{
    position:fixed!important;top:11px!important;left:auto!important;right:48px!important;
    height:32px!important;flex:0 0 auto!important;gap:0!important;margin:0!important;
    z-index:11!important;
  }
  #dsh-makers-actions a,#dsh-makers-actions button{width:31px!important;height:32px!important;padding:0!important;justify-content:center!important;flex:0 0 auto!important}
  #dsh-makers-actions svg{width:16px!important;height:16px!important}
  .dsh-makers-action-label{display:none!important}
  /* 抽屉展开时隐藏图标，避免浮在抽屉右侧残留的内容区上 */
  [class*="_frame"]:not([data-sidebar-collapsed]) #dsh-makers-chrome,
  [class*="_frame"]:not([data-sidebar-collapsed]) #dsh-makers-powered,
  [class*="_frame"]:not([data-sidebar-collapsed]) #dsh-makers-actions{display:none!important}

  /* 4. 虚拟键盘：不再猜"键盘是否弹出"——安卓 Chrome 上 innerHeight / visualViewport
        / offsetTop 的组合跟预期不一致，差值判定会落空。改为让外壳高度始终等于
        visualViewport 的真实可视高度：键盘弹起时它自己变小，输入框自然上移；
        键盘收起时自己恢复。fixed 定位避免 iOS 把整页顶上去。 */
  #dsh-app-frame{
    position:fixed!important;top:0!important;left:0!important;right:0!important;
    height:var(--dsh-vvh,100%)!important;
  }
  #dsh-makers-chrome{top:0!important}

  /* 5. 设置面板：官方用 flex row（左导航188px + 右内容154px），窄屏下右栏被
        压成竖条、文字一字一行。改成单列：导航横排成 tab，内容占满整宽。 */
  [class*="VOzbGW_panel"]{flex-direction:column!important}
  [class*="VOzbGW_panel"] > [class*="VOzbGW_nav"]{
    flex:0 0 auto!important;width:100%!important;height:auto!important;
    box-sizing:border-box!important;padding:8px 14px 0!important;
    border-right:none!important;border-bottom:1px solid rgba(0,0,0,.07)!important;
  }
  [class*="VOzbGW_navTitle"]{padding:0 2px 8px!important}
  [class*="VOzbGW_navList"]{
    flex-direction:row!important;gap:6px!important;width:100%!important;
    overflow-x:auto!important;-webkit-overflow-scrolling:touch!important;
    padding-bottom:8px!important;
  }
  [class*="VOzbGW_navCell"]{
    flex:0 0 auto!important;min-width:0!important;width:auto!important;
    padding:0 14px!important;white-space:nowrap!important;
  }
  [class*="VOzbGW_navCell"] [class*="VOzbGW_navLabel"]{font-size:14px!important}
  [class*="VOzbGW_panel"] > [class*="VOzbGW_content"]{
    flex:1 1 auto!important;width:100%!important;min-width:0!important;
  }
  [class*="VOzbGW_content"] [class*="VOzbGW_options"]>div{width:100%!important;box-sizing:border-box!important}
  [class*="VOzbGW_content"] [class*="_section"]{max-width:100%!important}

  /* 6. 模型/推理等级弹出菜单：约束在视口内、避免贴左边缘 */
  [class*="_7KE1Ra_menu"]{
    max-width:calc(100vw - 32px)!important;box-sizing:border-box!important;
    border-radius:12px!important;box-shadow:0 12px 36px rgba(0,0,0,.18)!important;
  }
  [class*="_7KE1Ra_menu"] [role="menuitem"]{min-height:44px!important}
}

(() => {
  // 多端同步：所有设备默认收敛到同一个共享会话 ID，避免每台设备首次打开
  // 各自生成随机 UUID，导致手机/电脑落到不同 sidecar、看不到彼此的对话。
  // 需要互相隔离的独立会话可用 URL 参数 ?dsh_sid=my-room 指定。
  const key = 'dsh-makers-web-conversation-id';
  const DEFAULT_SID = 'dsh-shared';
  const params = new URLSearchParams(location.search);
  const fromUrl = params.get('dsh_sid');
  const validSid = (v) => typeof v === 'string' && /^[a-zA-Z0-9_-]{1,64}$/.test(v) && v.indexOf('dsh-global') !== 0;
  let conversationId;
  if (validSid(fromUrl)) {
    conversationId = fromUrl;
  } else {
    const saved = localStorage.getItem(key);
    // 忽略旧的随机 UUID（8-4-4-4-12 形态），它正是各端不同步的根源；
    // 保留用户此前通过 URL 显式选择过的自定义会话名。
    conversationId = (saved && !/^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-/.test(saved) && validSid(saved))
      ? saved
      : DEFAULT_SID;
  }
  localStorage.setItem(key, conversationId);
  window.__DSH_MAKERS_CONVERSATION_ID__ = conversationId;
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (input, init = {}) => {
    const target = new URL(typeof input === 'string' || input instanceof URL ? input : input.url, location.href);
    if (target.origin !== location.origin || (!target.pathname.startsWith('/api') && !target.pathname.startsWith('/rpc'))) {
      return nativeFetch(input, init);
    }
    const headers = new Headers(input instanceof Request ? input.headers : init.headers);
    headers.set('makers-conversation-id', conversationId);
    if (input instanceof Request) return nativeFetch(new Request(input, { ...init, headers }));
    return nativeFetch(input, { ...init, headers });
  };
})();
(() => {
  // WorkBuddy 式抽屉：注入遮罩，展开侧边栏时显示，点击遮罩收起。
  // 官方展开态自带的 overlayLayer 是 pointer-events:none，点不到，只能自建。
  if (!matchMedia('(max-width:700px)').matches) return;
  const scrim = document.createElement('div');
  scrim.id = 'dsh-drawer-scrim';
  scrim.setAttribute('aria-hidden', 'true');
  const close = () => {
    document.body.removeAttribute('data-dsh-drawer');
    const frame = document.querySelector('[class*="_frame"]');
    const toggle = frame?.querySelector('[class*="_sidebarCol"] button[aria-label*="侧边栏"]');
    if (toggle) toggle.click();
  };
  scrim.addEventListener('click', close);
  const mount = () => {
    if (!document.getElementById('dsh-drawer-scrim')) document.body.appendChild(scrim);
    const frame = document.querySelector('[class*="_frame"]');
    if (!frame) return;
    const sync = () => {
      const expanded = !frame.hasAttribute('data-sidebar-collapsed');
      if (expanded) document.body.setAttribute('data-dsh-drawer', 'open');
      else document.body.removeAttribute('data-dsh-drawer');
    };
    sync();
    new MutationObserver(sync).observe(frame, { attributes: true, attributeFilter: ['data-sidebar-collapsed'] });
  };
  if (document.body) mount();
  else document.addEventListener('DOMContentLoaded', mount);
})();
(() => {
  const id = 'dsh-makers-hover-tip';
  const hostOf = (node) => {
    if (!(node instanceof Element)) return null;
    const tip = (el) => el && el.getAttribute('data-tip') ? el : null;
    const from = (el) => el ? tip(el) || tip(el.querySelector('[data-tip]')) : null;
    return tip(node.closest('[data-tip]'))
      || from(node.closest('[role="menuitem"]'))
      || from([...node.children].find((child) => child.getAttribute('role') === 'menuitem'));
  };
  const bubble = () => {
    let el = document.getElementById(id);
    if (el) return el;
    el = document.createElement('div');
    el.id = id;
    el.setAttribute('role', 'tooltip');
    el.hidden = true;
    document.body.appendChild(el);
    return el;
  };
  const hide = () => {
    const el = document.getElementById(id);
    if (el) el.hidden = true;
  };
  const show = (host) => {
    const text = host.getAttribute('data-tip');
    if (!text) return hide();
    const el = bubble();
    el.textContent = text;
    el.hidden = false;
    const r = host.closest('[role="menuitem"]')?.getBoundingClientRect() ?? host.getBoundingClientRect();
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    let left = r.left + r.width / 2 - w / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
    let top = r.top - h - 8;
    if (top < 8) top = r.bottom + 8;
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  };
  document.addEventListener('pointerover', (event) => {
    const host = hostOf(event.target);
    if (host) show(host);
    else hide();
  });
  document.addEventListener('pointerdown', hide);
  window.addEventListener('scroll', hide, true);
})();
(() => {
  /* 虚拟键盘跟随：不再判断"键盘是否弹出"（安卓 Chrome 上 innerHeight /
     visualViewport / offsetTop 的组合会让差值判定落空）。直接给主外壳打一个
     稳定的 id，并让它的高度永远等于 visualViewport 的实时可视高度：
     键盘弹起 → vv.height 缩小 → 外壳变矮 → 输入框整体上移；
     键盘收起 → vv.height 恢复 → 外壳回到全屏。安卓/ iOS 同一套逻辑。 */
  const vv = window.visualViewport;
  const root = document.documentElement;
  const isTextEntry = (el) => !!el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' || el.isContentEditable === true);
  const markFrame = () => {
    if (document.getElementById('dsh-app-frame')) return true;
    for (const el of document.querySelectorAll('[class*="_frame"]')) {
      if (el.querySelector('[class*="_centerCol"]')) {
        el.id = 'dsh-app-frame';
        return true;
      }
    }
    return false;
  };
  markFrame();
  document.addEventListener('DOMContentLoaded', markFrame);

  if (!vv) return;
  let scheduled = 0;
  let lastHeight = -1;
  const sync = () => {
    scheduled = 0;
    markFrame();
    const viewHeight = Math.max(240, Math.round(vv.height));
    const viewTop = Math.round(vv.offsetTop);
    root.style.setProperty('--dsh-vvh', viewHeight + 'px');
    root.style.setProperty('--dsh-vv-top', viewTop + 'px');
    if (viewHeight !== lastHeight) {
      lastHeight = viewHeight;
      const scroller = document.querySelector('[class*="_scrollBody"]');
      if (scroller && isTextEntry(document.activeElement)) scroller.scrollTop = scroller.scrollHeight;
    }
  };
  const schedule = () => {
    if (!scheduled) scheduled = requestAnimationFrame(sync);
  };
  vv.addEventListener('resize', schedule);
  vv.addEventListener('scroll', schedule);
  document.addEventListener('focusin', (event) => {
    if (!isTextEntry(event.target)) return;
    schedule();
    setTimeout(schedule, 280);
  });
  document.addEventListener('focusout', () => setTimeout(schedule, 160));
  window.addEventListener('orientationchange', () => setTimeout(schedule, 200));
  schedule();
})();

  const deployIcon = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15c-1 2-1 4-1 4s2 0 4-1"/><path d="M9 18c-1.5-.6-2.4-1.5-3-3 3.2-7 7.6-9.5 14-9-.5 6.4-3 10.8-10 14z"/><path d="M13.5 10.5a1.5 1.5 0 1 0 2.1-2.1 1.5 1.5 0 0 0-2.1 2.1z"/></svg>';
  const moreIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  const configIcon = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>';
  const bubbleIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
  const mount = () => {
    if (document.getElementById("dsh-makers-actions")) return;
    const nav = document.createElement("nav");
    nav.id = "dsh-makers-actions";
    nav.setAttribute("aria-label", "EdgeOne Makers");
    nav.dataset.docked = "false";
    const github = document.createElement("a");
    github.href = "https://github.com/TencentEdgeOne/deepseek-harness";
    github.target = "_blank";
    github.rel = "noopener noreferrer";
    github.innerHTML = githubIcon + '<span class="dsh-makers-action-label"></span>';
    const deploy = document.createElement("a");
    deploy.target = "_blank";
    deploy.rel = "noopener noreferrer";
    deploy.innerHTML = deployIcon + '<span class="dsh-makers-action-label"></span>';
    const config = document.createElement("button");
    config.type = "button";
    config.id = "dsh-makers-config";
    config.innerHTML = configIcon + '<span class="dsh-makers-action-label"></span>';
    config.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (window.dshMakersConfig) window.dshMakersConfig.open();
    });
    nav.append(github, deploy, config);
    const powered = document.createElement("div");
    powered.id = "dsh-makers-powered";
    powered.dataset.docked = "false";
    powered.innerHTML = '<span class="dsh-makers-powered-label"></span><span class="dsh-makers-powered-divider" aria-hidden="true"></span><button type="button" class="dsh-makers-powered-more"><span class="dsh-makers-powered-more-label"></span>' + moreIcon + "</button>";
    const more = powered.querySelector(".dsh-makers-powered-more");
    const chrome = document.createElement("div");
    chrome.id = "dsh-makers-chrome";
    const dialog = document.createElement("div");
    dialog.id = "dsh-makers-contact";
    dialog.hidden = true;
    dialog.innerHTML = '<div class="dsh-makers-contact-overlay" data-close="true"></div><div class="dsh-makers-contact-card" role="dialog" aria-modal="true" aria-labelledby="dsh-makers-contact-title"><div class="dsh-makers-contact-body"><div class="dsh-makers-contact-icon">' + bubbleIcon + '</div><h2 id="dsh-makers-contact-title"></h2><p></p></div><div class="dsh-makers-contact-footer"><button type="button" class="dsh-makers-contact-later" data-close="true"></button><a class="dsh-makers-contact-go" target="_blank" rel="noopener noreferrer"></a></div></div>';
    const centerCol = () => document.querySelector("[class*=\"_centerCol\"]");
    const titleRow = () => document.querySelector("[class*=\"_titleRow\"]");
    const headerOf = (row) => row?.closest("header") || row?.parentElement || null;
    const headerVisible = (header) => {
      if (!header) return false;
      if ([...header.classList].some((name) => name.includes("headerHidden"))) return false;
      const style = getComputedStyle(header);
      return style.display !== "none" && style.visibility !== "hidden";
    };
    let adopting = false;
    let laying = false;
    let layoutRaf = 0;
    const overlap = (a, b, gap) => a.left < b.right + gap && a.right + gap > b.left && a.top < b.bottom && a.bottom > b.top;
    const layout = () => {
      if (laying || !nav.isConnected || !powered.isConnected) return;
      laying = true;
      try {
        document.documentElement.style.setProperty("--dsh-makers-actions-width", Math.ceil(nav.getBoundingClientRect().width) + 12 + "px");
        const hit = () => {
          const a = nav.getBoundingClientRect();
          const b = powered.getBoundingClientRect();
          if (!a.width || !b.width) return false;
          if (overlap(a, b, 8)) return true;
          if (powered.dataset.docked !== "true") return false;
          const cluster = titleRow()?.querySelector("[class*=\"_titleCluster\"]");
          return !!(cluster && overlap(cluster.getBoundingClientRect(), b, 8));
        };
        const apply = (level) => {
          powered.dataset.compact = level >= 1 ? "true" : "false";
          nav.dataset.compact = level >= 2 ? "true" : "false";
          powered.dataset.hidden = level >= 3 ? "true" : "false";
        };
        const current = powered.dataset.hidden === "true" ? 3 : nav.dataset.compact === "true" ? 2 : powered.dataset.compact === "true" ? 1 : 0;
        if (hit()) {
          if (current < 3) apply(current + 1);
        } else if (current > 0) {
          apply(current - 1);
          if (hit()) apply(current);
        }
      } finally {
        laying = false;
      }
    };
    const scheduleLayout = () => {
      if (layoutRaf) return;
      layoutRaf = requestAnimationFrame(() => {
        layoutRaf = 0;
        layout();
      });
    };
    const adopt = () => {
      if (adopting) return;
      adopting = true;
      try {
        const host = centerCol();
        if (!host) return;
        const row = titleRow();
        const header = headerOf(row);
        const utilities = header?.querySelector("[class*=\"_headerUtilities\"]");
        if (headerVisible(header) && utilities) {
          if (nav.parentElement !== utilities) utilities.append(nav);
          if (powered.parentElement !== row) row.append(powered);
          chrome.remove();
          nav.dataset.docked = "true";
          powered.dataset.docked = "true";
        } else {
          if (chrome.parentElement !== host) host.append(chrome);
          if (powered.parentElement !== chrome) chrome.append(powered);
          if (nav.parentElement !== chrome) chrome.append(nav);
          nav.dataset.docked = "false";
          powered.dataset.docked = "false";
        }
        if (ro) {
          ro.observe(nav);
          ro.observe(powered);
          ro.observe(host);
          if (row) ro.observe(row);
        }
        scheduleLayout();
      } finally {
        adopting = false;
      }
    };
    const ro = typeof ResizeObserver === "undefined" ? null : new ResizeObserver(scheduleLayout);
    const applyCopy = () => {
      const locale = localeOf();
      const t = copy[locale];
      github.title = t.github;
      github.querySelector(".dsh-makers-action-label").textContent = t.github;
      deploy.href = deployHref;
      deploy.title = t.deploy;
      deploy.querySelector(".dsh-makers-action-label").textContent = t.deploy;
      config.title = t.config;
      config.querySelector(".dsh-makers-action-label").textContent = t.config;
      more.title = t.poweredTitle;
      more.querySelector(".dsh-makers-powered-more-label").textContent = t.more;
      powered.querySelector(".dsh-makers-powered-label").innerHTML = t.powered;
      dialog.querySelector("#dsh-makers-contact-title").textContent = t.title;
      dialog.querySelector(".dsh-makers-contact-body p").textContent = t.body;
      dialog.querySelector(".dsh-makers-contact-later").textContent = t.later;
      const go = dialog.querySelector(".dsh-makers-contact-go");
      go.href = contactHref;
      go.textContent = t.go;
    };
    applyCopy();
    new MutationObserver(applyCopy).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
    const close = () => {
      dialog.hidden = true;
      more.focus();
    };
    const open = () => {
      dialog.hidden = false;
      dialog.querySelector(".dsh-makers-contact-later")?.focus();
    };
    more.addEventListener("click", open);
    dialog.addEventListener("click", (event) => {
      if (event.target.closest("[data-close]")) close();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !dialog.hidden) close();
    });
    document.body.append(dialog);
    adopt();
    const observer = new MutationObserver(adopt);
    observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style", "hidden"] });
    window.addEventListener("resize", scheduleLayout);
  };
  if (document.body) mount();
  else document.addEventListener("DOMContentLoaded", mount);
})();
</script>

<script>
(() => {
  if (window.dshMakersConfig) return;
  const PANEL_HTML = '<div id="dsh-makers-config-panel" hidden>'
    + '<div class="dsh-cfg-overlay" data-cfg-close="1"></div>'
    + '<div class="dsh-cfg-card" role="dialog" aria-modal="true" aria-labelledby="dsh-cfg-title">'
    + '<header><h2 id="dsh-cfg-title">运行配置</h2>'
    + '<p class="dsh-cfg-sub">改动默认只影响当前会话；勾选下面那项可写入全局。</p>'
    + '<p class="dsh-cfg-source" id="dsh-cfg-source" hidden></p>'
    + '<label class="dsh-cfg-scope"><input type="checkbox" id="dsh-cfg-global" />保存到全局，所有新会话都继承</label>'
    + '<button type="button" class="dsh-cfg-x" data-cfg-close="1" aria-label="关闭">×</button></header>'
    + '<div class="dsh-cfg-body">'
    + '<section><h3>全局规则<small>写入 AGENTS.md，每次会话开始注入</small></h3>'
    + '<textarea id="dsh-cfg-instructions" rows="5" placeholder="例如：所有回答使用中文；改动前先读文件；不要执行破坏性命令。"></textarea></section>'
    + '<section><h3>MCP 服务器<small>Streamable HTTP，可带自定义请求头</small></h3>'
    + '<div id="dsh-cfg-servers" class="dsh-cfg-list"></div>'
    + '<button type="button" class="dsh-cfg-add" data-cfg-add="server">+ 添加 MCP 服务器</button></section>'
    + '<section><h3>技能<small>写入 skills/&lt;name&gt;/SKILL.md</small></h3>'
    + '<div id="dsh-cfg-skills" class="dsh-cfg-list"></div>'
    + '<button type="button" class="dsh-cfg-add" data-cfg-add="skill">+ 添加技能</button></section>'
    + '</div>'
    + '<footer><span id="dsh-cfg-status"></span>'
    + '<div class="dsh-cfg-actions">'
    + '<button type="button" class="dsh-cfg-reset" id="dsh-cfg-reset" hidden>恢复全局</button>'
    + '<button type="button" class="dsh-cfg-cancel" data-cfg-close="1">取消</button>'
    + '<button type="button" class="dsh-cfg-save" id="dsh-cfg-save">保存并重启会话</button>'
    + '</div></footer></div></div>';

  let panel = null;
  let refs = null;
  let bundle = { instructions: '', mcpServers: [], skills: [] };
  let busy = false;

  const escapeHtml = (value) => String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  const setStatus = (text, tone) => {
    if (!refs) return;
    refs.status.textContent = text || '';
    if (tone) refs.status.dataset.tone = tone;
    else delete refs.status.dataset.tone;
  };

  const renderSource = (source, hasGlobalBaseline) => {
    if (!refs) return;
    let text = '';
    let tone = '';
    if (source === 'session') {
      text = '本会话已单独保存配置，不再跟随部署级更新。';
      tone = 'session';
    } else if (source === 'global') {
      text = '正在继承全局配置（所有新会话共享），改动并保存后本会话将独立。';
    } else if (hasGlobalBaseline) {
      text = '全局配置为空，可直接在此添加。';
    }
    refs.source.textContent = text;
    refs.source.hidden = !text;
    if (tone) refs.source.dataset.tone = tone;
    else delete refs.source.dataset.tone;
    refs.reset.hidden = !(source === 'session' && hasGlobalBaseline);
  };

  const serverRow = (server, index) => `
    <div class="dsh-cfg-item" data-kind="server" data-index="${index}">
      <div class="dsh-cfg-row">
        <input data-field="name" value="${escapeHtml(server.name)}" placeholder="名称，例如 context7" aria-label="MCP 名称" />
        <label><input type="checkbox" data-field="enabled" ${server.enabled ? 'checked' : ''} />启用</label>
        <button type="button" class="dsh-cfg-del" data-cfg-remove="server">删除</button>
      </div>
      <div class="dsh-cfg-row">
        <input data-field="url" value="${escapeHtml(server.url)}" placeholder="https://example.com/mcp" aria-label="MCP 地址" />
      </div>
      <textarea data-field="headers" rows="2" placeholder='请求头 JSON，例如 {"Authorization":"Bearer xxx"}' aria-label="MCP 请求头">${escapeHtml(JSON.stringify(server.headers && Object.keys(server.headers).length ? server.headers : {}))}</textarea>
    </div>`;

  const skillRow = (skill, index) => `
    <div class="dsh-cfg-item" data-kind="skill" data-index="${index}">
      <div class="dsh-cfg-row">
        <input data-field="name" value="${escapeHtml(skill.name)}" placeholder="名称，例如 pdf-report" aria-label="技能名称" />
        <button type="button" class="dsh-cfg-del" data-cfg-remove="skill">删除</button>
      </div>
      <div class="dsh-cfg-row">
        <input data-field="description" value="${escapeHtml(skill.description)}" placeholder="一句话说明何时使用（模型靠它决定是否加载）" aria-label="技能描述" />
      </div>
      <textarea data-field="body" rows="5" placeholder="技能正文（Markdown），会被写进 SKILL.md" aria-label="技能正文">${escapeHtml(skill.body)}</textarea>
    </div>`;

  const render = () => {
    if (!refs) return;
    refs.servers.innerHTML = bundle.mcpServers.length
      ? bundle.mcpServers.map(serverRow).join('')
      : '<p class="dsh-cfg-empty">还没有额外的 MCP 服务器，内置的 EdgeOne Makers 工具始终可用。</p>';
    refs.skills.innerHTML = bundle.skills.length
      ? bundle.skills.map(skillRow).join('')
      : '<p class="dsh-cfg-empty">还没有技能。技能是可按需加载的 Markdown 说明文档。</p>';
  };

  const collect = () => {
    bundle.instructions = refs.instructions.value;
    bundle.mcpServers = [...refs.servers.querySelectorAll('[data-kind="server"]')].map((item) => {
      let headers = {};
      try {
        const parsed = JSON.parse(item.querySelector('[data-field="headers"]').value || '{}');
        if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) headers = parsed;
      } catch {
        throw new Error('MCP 请求头需要是合法 JSON');
      }
      const name = item.querySelector('[data-field="name"]').value.trim();
      return {
        id: name,
        name,
        url: item.querySelector('[data-field="url"]').value.trim(),
        headers,
        enabled: item.querySelector('[data-field="enabled"]').checked,
      };
    });
    bundle.skills = [...refs.skills.querySelectorAll('[data-kind="skill"]')].map((item) => ({
      name: item.querySelector('[data-field="name"]').value.trim(),
      description: item.querySelector('[data-field="description"]').value.trim(),
      body: item.querySelector('[data-field="body"]').value,
    }));
  };

  const load = async () => {
    setStatus('读取配置…');
    try {
      const response = await fetch('/api/dshConfig', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'read' }),
      });
      const data = await response.json();
      if (!data.ok) throw new Error(data.error || '读取失败');
      bundle = {
        instructions: data.bundle.instructions || '',
        mcpServers: data.bundle.mcpServers || [],
        skills: data.bundle.skills || [],
      };
      refs.instructions.value = bundle.instructions;
      render();
      renderSource(data.source || 'empty', Boolean(data.hasGlobalBaseline));
      setStatus('');
    } catch (error) {
      setStatus(error && error.message ? error.message : '读取失败', 'error');
    }
  };

  const save = async () => {
    if (busy) return;
    try {
      collect();
    } catch (error) {
      setStatus(error.message, 'error');
      return;
    }
    busy = true;
    refs.save.disabled = true;
    setStatus('保存中…');
    try {
      const scope = refs.global.checked ? 'global' : 'session';
      const response = await fetch('/api/dshConfig', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'write', bundle, scope }),
      });
      const data = await response.json();
      if (!data.ok) throw new Error(data.error || '保存失败');
      setStatus(scope === 'global' ? '已保存到全局，所有新会话生效，正在重启…' : '已保存，正在重启会话…', 'ok');
      setTimeout(() => location.reload(), 1200);
    } catch (error) {
      setStatus(error && error.message ? error.message : '保存失败', 'error');
      busy = false;
      refs.save.disabled = false;
    }
  };

  const reset = async () => {
    if (busy) return;
    busy = true;
    refs.save.disabled = true;
    refs.reset.disabled = true;
    setStatus('正在恢复全局配置…');
    try {
      const response = await fetch('/api/dshConfig', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'reset' }),
      });
      const data = await response.json();
      if (!data.ok) throw new Error(data.error || '恢复失败');
      setStatus('已恢复，正在重启会话…', 'ok');
      setTimeout(() => location.reload(), 1200);
    } catch (error) {
      setStatus(error && error.message ? error.message : '恢复失败', 'error');
      busy = false;
      refs.save.disabled = false;
      refs.reset.disabled = false;
    }
  };

  const close = () => {
    if (!panel) return;
    panel.hidden = true;
    document.documentElement.style.overflow = '';
    setStatus('');
  };

  const ensure = () => {
    if (panel) return;
    const host = document.createElement('div');
    host.innerHTML = PANEL_HTML;
    panel = host.firstElementChild;
    document.body.append(panel);
    refs = {
      servers: panel.querySelector('#dsh-cfg-servers'),
      skills: panel.querySelector('#dsh-cfg-skills'),
      instructions: panel.querySelector('#dsh-cfg-instructions'),
      status: panel.querySelector('#dsh-cfg-status'),
      source: panel.querySelector('#dsh-cfg-source'),
      global: panel.querySelector('#dsh-cfg-global'),
      save: panel.querySelector('#dsh-cfg-save'),
      reset: panel.querySelector('#dsh-cfg-reset'),
    };
    panel.addEventListener('click', (event) => {
      if (event.target.closest('[data-cfg-close]')) {
        event.preventDefault();
        close();
        return;
      }
      const add = event.target.closest('[data-cfg-add]');
      if (add) {
        try { collect(); } catch (error) { setStatus(error.message, 'error'); return; }
        if (add.dataset.cfgAdd === 'server') bundle.mcpServers.push({ id: '', name: '', url: '', headers: {}, enabled: true });
        else bundle.skills.push({ name: '', description: '', body: '' });
        render();
        const container = add.dataset.cfgAdd === 'server' ? refs.servers : refs.skills;
        const last = container.lastElementChild;
        const input = last && last.querySelector('input');
        if (input) input.focus();
        return;
      }
      const remove = event.target.closest('[data-cfg-remove]');
      if (remove) {
        const item = remove.closest('[data-kind]');
        const index = Number(item.dataset.index);
        try { collect(); } catch (error) { setStatus(error.message, 'error'); return; }
        if (item.dataset.kind === 'server') bundle.mcpServers.splice(index, 1);
        else bundle.skills.splice(index, 1);
        render();
      }
    });
    panel.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') close();
    });
    refs.save.addEventListener('click', save);
    refs.reset.addEventListener('click', reset);
  };

  const open = () => {
    ensure();
    panel.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    void load();
  };

  window.dshMakersConfig = { open, close };
})();
</script>
